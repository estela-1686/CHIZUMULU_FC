<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CUFC | 치주물루 유나이티드</title>
<link rel="icon" id="fav">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<style>

:root{
  --main:#29388a;      /* top bar — logo blue */
  --deep:#121c55;      /* sub band */
  --sub-link:#8f9bea;
  --dark:#222; --darker:#181818;
  --bg:#efefef; --line:#e3e3e3; --txt:#666; --ink:#2f2f2f; --muted:#999;
  --fw:#4b45c9; --mf:#12ad99; --df:#2a83d5; --gk:#3f9f1e; --coach:#e3a92f;
  --red:#e0362f;
}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:auto}
body{font-family:"Pretendard",-apple-system,"Noto Sans KR",sans-serif;color:var(--txt);background:var(--bg);font-size:16px;line-height:1.5;-webkit-font-smoothing:antialiased;word-break:keep-all;overflow-x:hidden}
a{color:inherit;text-decoration:none}
button{font:inherit;background:none;border:0;color:inherit;cursor:pointer}
.in{max-width:1240px;margin:0 auto;padding:0 12px}

/* ===== GNB (red bar in KFA) ===== */
#gnb{position:sticky;top:0;z-index:100}
.top{background:var(--main);height:72px}
.top .in{display:flex;align-items:center;height:100%;gap:28px}
.logo{display:flex;align-items:center;gap:8px;color:#fff;flex:none}
.logo .mark{width:50px;height:50px;display:block}
.logo .mark img{width:50px;height:50px;display:block}
.logo b{display:block;font-size:22px;font-weight:800;letter-spacing:-.01em;line-height:1}
.logo small{display:block;font-size:10.5px;line-height:1.15;margin-top:3px;opacity:.95}
.menu{display:flex;gap:4px;flex:1;justify-content:center}
.menu a{color:#fff;font-weight:700;font-size:16px;padding:0 20px;height:72px;display:flex;align-items:center;position:relative}
.menu a.on::after{content:"";position:absolute;left:20px;right:20px;bottom:0;height:4px;background:#fff}
.util{display:flex;align-items:center;gap:16px;color:#fff;flex:none}
.util svg{width:22px;height:22px;stroke:#fff;fill:none;stroke-width:2}
.util .lg{font-weight:800;font-size:15px}
.burger{display:none;color:#fff}
.burger svg{width:26px;height:26px;stroke:#fff;stroke-width:2.2}
.drawer{display:none;background:var(--main);border-top:1px solid rgba(255,255,255,.2)}
.drawer a{display:block;color:#fff;font-weight:700;padding:14px 16px;border-bottom:1px solid rgba(255,255,255,.12)}
.drawer.open{display:block}

/* ===== sub band (navy) ===== */
.band{background:var(--deep);min-height:64px}
.band .in{display:flex;align-items:center;gap:40px;min-height:64px;padding-top:6px;padding-bottom:6px}
.band h2{color:#fff;font-size:25px;font-weight:700;flex:none;min-width:150px}
.subnav{display:flex;flex-wrap:wrap;gap:4px 0}
.subnav a{position:relative;color:var(--sub-link);font-size:13.76px;padding:6px 10px}
.subnav a:hover{color:#fff}
.subnav a.on{color:#fff;font-weight:700}
.subnav a.on::before{content:"";position:absolute;left:10px;right:10px;top:-6px;height:3px;background:#fff}

@media (max-width:980px){
  .menu,.util .ic{display:none}.burger{display:block}
  .top .in{justify-content:space-between}
  .band .in{flex-direction:column;align-items:flex-start;gap:4px;padding-top:12px;padding-bottom:8px}
  .band h2{font-size:21px}
  .subnav{flex-wrap:nowrap;overflow-x:auto;width:100%;scrollbar-width:none;padding-top:6px}
  .subnav::-webkit-scrollbar{display:none}
  .subnav a{white-space:nowrap}
  .subnav a:first-child{padding-left:0}.subnav a.on:first-child::before{left:0}
}

/* ===== content blocks ===== */
.content{padding:28px 0 60px}
.visual{position:relative;height:300px;border-radius:2px;overflow:hidden;background:linear-gradient(110deg,#151f5c 0%,#29388a 55%,#36868c 100%);color:#fff;margin-bottom:28px}
.visual .tx{position:absolute;left:56px;top:50%;transform:translateY(-50%);z-index:2}
.visual .tx small{font-size:14px;letter-spacing:.2em;opacity:.8;font-weight:600}
.visual .tx b{display:block;font-size:54px;font-weight:900;line-height:1.05;letter-spacing:-.02em;margin:8px 0 10px}
.visual .tx span{font-size:16px;opacity:.9}
.visual .cr{position:absolute;right:60px;top:50%;transform:translateY(-50%);width:220px;height:auto;z-index:2;filter:drop-shadow(0 12px 30px rgba(0,0,0,.35))}
.visual .wv{position:absolute;left:0;right:0;bottom:0;height:120px;z-index:1;opacity:.35}
@media (max-width:760px){.visual{height:220px}.visual .tx{left:20px;right:120px}.visual .tx b{font-size:32px}.visual .tx span{font-size:13px}.visual .cr{right:16px;width:96px}}

.box{background:#fff;border:1px solid var(--line);margin-bottom:28px}
.bar{background:var(--dark);color:#fff;display:flex;align-items:stretch;min-height:56px}
.bar h3{font-size:24px;font-weight:300;padding:0 24px;display:flex;align-items:center;flex:none;min-width:170px}
.bar .opt{flex:1;border-left:1px solid #3a3a3a;display:flex;align-items:center;padding:0 20px;position:relative}
.bar select{appearance:none;background:transparent;color:#fff;border:0;font:inherit;font-size:16px;font-weight:500;padding:8px 8px 8px 22px;width:100%;cursor:pointer}
.bar select option{color:#222}
.bar .opt::before{content:"";position:absolute;left:22px;top:50%;width:8px;height:8px;border-right:2px solid #fff;border-bottom:2px solid #fff;transform:translateY(-70%) rotate(45deg);pointer-events:none}
.bar .opt.static{font-size:16px;font-weight:500}
.bar .opt.static::before{display:none}
@media (max-width:760px){.bar{flex-direction:column}.bar h3{font-size:20px;min-height:50px;padding:0 16px}.bar .opt{border-left:0;border-top:1px solid #3a3a3a;min-height:46px;padding:0 12px}.bar select{font-size:14px}}

/* tabs: All Players FW MF DF GK Coach */
.ptabs{display:flex;gap:18px;padding:22px 24px 18px;flex-wrap:wrap}
.ptabs button{font-size:20px;font-weight:800;color:#ccc;font-family:inherit}
.ptabs button.on{color:var(--ink)}
@media (max-width:760px){.ptabs{gap:12px;padding:16px}.ptabs button{font-size:17px}}

/* player grid */
.plist{display:grid;grid-template-columns:repeat(3,1fr);border-top:1px solid var(--line)}
.pl{display:flex;gap:16px;padding:22px 18px 20px;border-right:1px solid var(--line);border-bottom:1px solid var(--line);min-height:117px;position:relative}
.pl:nth-child(3n){border-right:0}
.pl .pic{flex:none;width:64px;height:64px;border-radius:50%;background:#e6ebf3;overflow:hidden;position:relative}
.pl .pic svg{position:absolute;left:50%;bottom:-4px;transform:translateX(-50%);width:54px;height:58px}
.pl .info{flex:1;min-width:0}
.pl .nm{font-size:14px;font-weight:700;color:var(--ink);line-height:1.35}
.pl .en{font-size:14px;color:var(--ink);line-height:1.35}
.pl .note{font-size:11.5px;color:var(--red);margin-top:2px}
.pl .meta{font-size:11.5px;color:var(--muted);margin-top:8px;line-height:1.35}
.pl .pos{position:absolute;right:18px;top:20px;font-size:14px}
.pos.FW{color:var(--fw)}.pos.MF{color:var(--mf)}.pos.DF{color:var(--df)}.pos.GK{color:var(--gk)}.pos.CO{color:var(--coach)}
@media (max-width:980px){.plist{grid-template-columns:repeat(2,1fr)}.pl:nth-child(3n){border-right:1px solid var(--line)}.pl:nth-child(2n){border-right:0}}
@media (max-width:560px){.plist{grid-template-columns:1fr}.pl{border-right:0!important}}

/* match list (경기결과) */
.mlist .m{padding:18px 24px 16px;border-bottom:1px solid var(--line)}
.mlist .m:last-child{border-bottom:0}
.m .hd{display:flex;justify-content:space-between;align-items:flex-end;gap:12px}
.m .comp{font-size:12px;color:var(--ink);font-weight:500}
.m .ven{font-size:12px;color:var(--txt)}
.m .dt{font-size:12px;color:var(--muted);white-space:nowrap}
.m .rows{margin-top:18px;display:grid;gap:10px}
.m .r{display:flex;align-items:center;gap:10px}
.m .r .fl{width:24px;height:24px;border-radius:50%;flex:none;display:grid;place-items:center;font-size:8.5px;font-weight:800;background:#e8e8e8;color:#777;overflow:hidden}
.m .r .fl img{width:24px;height:24px}
.m .r .fl.us{background:transparent}
.m .r .tn{font-size:18px;color:var(--ink);font-weight:300;flex:1}
.m .r .tn.us{font-weight:500}
.m .r .sc{font-size:20px;font-weight:700;color:var(--ink);min-width:24px;text-align:right}
.m .r .sc.lo{color:#bbb}
.m .tag{display:inline-block;margin-left:8px;font-size:11px;font-weight:700;padding:1px 6px;border-radius:2px;vertical-align:2px}
.tag.W{background:#e7f4ec;color:#23824f}.tag.D{background:#eee;color:#777}.tag.L{background:#fde9e7;color:#c53a2f}.tag.P{background:#eef1fb;color:#4b5bb5}
.m .scr{margin-top:10px;font-size:12px;color:var(--muted)}
@media (max-width:760px){.mlist .m{padding:16px}.m .r .tn{font-size:16px}}

/* generic table */
.tbl{width:100%;border-collapse:collapse;font-size:14px;color:var(--ink)}
.tbl th{background:#f7f7f7;font-weight:500;color:var(--txt);padding:12px 8px;border-bottom:1px solid var(--line);font-size:13px;white-space:nowrap}
.tbl td{padding:14px 8px;border-bottom:1px solid var(--line);text-align:center}
.tbl td.l{text-align:left}
.tbl tr:last-child td{border-bottom:0}
.tbl small{display:block;color:var(--muted);font-size:12px}
.scroll-x{overflow-x:auto}
@media (max-width:760px){.tbl .hm{display:none}}

/* club info */
.pad{padding:28px 24px}
@media (max-width:760px){.pad{padding:20px 16px}}
.dl{display:grid;grid-template-columns:repeat(2,1fr);border-top:2px solid var(--ink)}
.dl div{display:flex;border-bottom:1px solid var(--line);font-size:15px}
.dl dt{width:120px;flex:none;background:#f7f7f7;padding:14px 16px;color:var(--txt);font-weight:500}
.dl dd{padding:14px 16px;color:var(--ink)}
@media (max-width:760px){.dl{grid-template-columns:1fr}.dl dt{width:100px}}
.txt p{font-size:15px;line-height:1.8;color:var(--txt);margin-bottom:12px}
.txt h4{font-size:18px;color:var(--ink);font-weight:700;margin:24px 0 10px}
.cards{display:grid;grid-template-columns:repeat(2,1fr);border-top:1px solid var(--line)}
.cards > div{padding:24px;border-bottom:1px solid var(--line);border-right:1px solid var(--line)}
.cards > div:nth-child(2n){border-right:0}
.cards b{display:block;font-size:17px;color:var(--ink);margin-bottom:6px}
.cards p{font-size:14px;line-height:1.75}
@media (max-width:760px){.cards{grid-template-columns:1fr}.cards > div{border-right:0}}
.hist{border-top:1px solid var(--line)}
.hist div{display:flex;border-bottom:1px solid var(--line)}
.hist .y{width:150px;flex:none;padding:18px 24px;font-size:18px;font-weight:800;color:var(--main)}
.hist .d{padding:18px 24px 18px 0;font-size:15px;color:var(--ink);line-height:1.7}
@media (max-width:760px){.hist .y{width:96px;padding:14px 16px;font-size:15px}.hist .d{padding:14px 16px 14px 0;font-size:14px}}
.kits{display:grid;grid-template-columns:repeat(4,1fr);border-top:1px solid var(--line)}
.kit{padding:30px 16px 22px;text-align:center;border-right:1px solid var(--line)}
.kit:last-child{border-right:0}
.kit > svg{width:100%;max-width:150px;height:auto}
.kit b{display:block;margin-top:10px;color:var(--ink);font-weight:800}
.kit span{font-size:13px}
@media (max-width:760px){.kits{grid-template-columns:repeat(2,1fr)}.kit:nth-child(2n){border-right:0}.kit{border-bottom:1px solid var(--line)}}
.two{display:grid;grid-template-columns:1fr 1fr;gap:28px}
.two .box{margin-bottom:0}
@media (max-width:980px){.two{grid-template-columns:1fr}}
.more{display:block;text-align:center;padding:14px;font-size:14px;color:var(--txt);border-top:1px solid var(--line)}
.more:hover{color:var(--ink)}
.notice{font-size:12px;color:var(--muted);padding:14px 24px;border-top:1px solid var(--line)}

/* video grid */
.vgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:24px;padding:24px}
.vc{display:block;color:var(--ink)}
.vc .th{position:relative;aspect-ratio:16/9;background:#ddd center/cover no-repeat;overflow:hidden}
.vc .th::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,transparent 55%,rgba(0,0,0,.45))}
.vc .pl-ic{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:54px;height:54px;border-radius:50%;background:rgba(0,0,0,.55);display:grid;place-items:center;z-index:2;transition:background .2s}
.vc .pl-ic::before{content:"";border-left:16px solid #fff;border-top:10px solid transparent;border-bottom:10px solid transparent;margin-left:4px}
.vc:hover .pl-ic{background:var(--red)}
.vc .rib{position:absolute;left:-30px;top:12px;transform:rotate(-45deg);background:var(--red);color:#fff;font-size:11px;font-weight:800;padding:3px 34px;z-index:2;letter-spacing:.05em}
.vc .vt{margin-top:12px;font-size:15px;font-weight:700;line-height:1.45;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.vc .vd{margin-top:4px;font-size:12px;color:var(--muted)}
@media (max-width:980px){.vgrid{grid-template-columns:repeat(2,1fr)}}
@media (max-width:560px){.vgrid{grid-template-columns:1fr;padding:16px}}
.hl{display:inline-flex;align-items:center;gap:6px;margin-top:10px;font-size:12px;font-weight:700;color:#fff;background:var(--red);padding:5px 10px;border-radius:2px}
.hl::before{content:"";border-left:7px solid #fff;border-top:4.5px solid transparent;border-bottom:4.5px solid transparent}

/* support */
.ways{display:grid;grid-template-columns:repeat(3,1fr);border-top:1px solid var(--line)}
.ways > div{padding:26px 24px;border-right:1px solid var(--line);border-bottom:1px solid var(--line);display:flex;flex-direction:column}
.ways > div:nth-child(3n){border-right:0}
.ways .no{font-size:13px;font-weight:800;color:var(--main)}
.ways b{display:block;font-size:18px;color:var(--ink);margin:6px 0 8px}
.ways p{font-size:14px;line-height:1.7;flex:1}
.ways a.go{margin-top:14px;font-size:13px;font-weight:700;color:var(--main)}
@media (max-width:980px){.ways{grid-template-columns:1fr 1fr}.ways > div:nth-child(3n){border-right:1px solid var(--line)}.ways > div:nth-child(2n){border-right:0}}
@media (max-width:560px){.ways{grid-template-columns:1fr}.ways > div{border-right:0!important}}
.warn{margin:0 24px 24px;padding:14px 16px;background:#fff6e5;border:1px solid #f0d9a8;font-size:13px;color:#7a5a12;line-height:1.6}
.form{padding:28px 24px}
.frow{display:grid;grid-template-columns:160px 1fr;border-bottom:1px solid var(--line)}
.frow:first-child{border-top:2px solid var(--ink)}
.frow label.k{background:#f7f7f7;padding:16px;font-size:14px;font-weight:600;color:var(--ink)}
.frow label.k em{color:var(--red);font-style:normal;margin-left:2px}
.frow .v{padding:10px 14px;display:flex;flex-wrap:wrap;gap:8px 18px;align-items:center}
.frow input[type=text],.frow input[type=email],.frow textarea,.frow select{width:100%;font:inherit;font-size:14px;border:1px solid #ccc;padding:10px 12px;color:var(--ink);background:#fff;border-radius:0}
.frow textarea{min-height:160px;resize:vertical}
.frow input:focus,.frow textarea:focus,.frow select:focus{outline:2px solid var(--main);outline-offset:-1px;border-color:var(--main)}
.frow .rad{display:flex;align-items:center;gap:6px;font-size:14px;color:var(--ink);cursor:pointer}
.agree{margin-top:20px;padding:16px;background:#f7f7f7;font-size:13px;line-height:1.7}
.agree label{display:flex;gap:8px;align-items:center;margin-top:8px;color:var(--ink);font-weight:600;cursor:pointer}
.btns{display:flex;justify-content:center;gap:10px;margin-top:26px}
.btn{min-width:150px;height:50px;font-size:16px;font-weight:700;padding:0 24px;display:inline-flex;align-items:center;justify-content:center}
.btn.pri{background:var(--main);color:#fff}
.btn.sec{background:#fff;color:var(--ink);border:1px solid #bbb}
.err{color:var(--red);font-size:13px;text-align:center;margin-top:12px;min-height:1em}
.done{padding:28px 24px}
.done h4{font-size:20px;color:var(--ink);margin-bottom:8px}
.done pre{white-space:pre-wrap;font-family:inherit;font-size:14px;background:#f7f7f7;border:1px solid var(--line);padding:18px;margin-top:16px;color:var(--ink);line-height:1.7}
@media (max-width:760px){.frow{grid-template-columns:1fr}.frow label.k{padding:10px 14px}.btn{min-width:0;flex:1}}

/* admin */
.adm-edit{margin-left:10px;font-size:11px;font-weight:700;color:#fff;background:#555;padding:2px 8px;border-radius:2px;vertical-align:2px}
.adm-edit:hover{background:var(--main)}
.admbar{position:fixed;left:0;right:0;bottom:0;z-index:150;background:#111;color:#ddd;font-size:13px;box-shadow:0 -4px 16px rgba(0,0,0,.3)}
.admbar .in{display:flex;align-items:center;gap:8px;flex-wrap:wrap;padding-top:10px;padding-bottom:10px}
.admbar b{color:#ffd166;margin-right:6px}
.admbar button{background:#2c2c2c;color:#fff;padding:7px 12px;font-size:13px;font-weight:600;border:1px solid #444}
.admbar button:hover{background:var(--main);border-color:var(--main)}
.admbar .st{margin-left:auto;font-size:12px;color:#999}
body.is-admin{padding-bottom:64px}
.modal-bg{position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:200;display:flex;align-items:flex-start;justify-content:center;padding:40px 12px;overflow-y:auto}
.modal{background:#fff;width:100%;max-width:640px;box-shadow:0 20px 60px rgba(0,0,0,.4)}
.modal .mh{background:var(--dark);color:#fff;display:flex;justify-content:space-between;align-items:center;padding:16px 20px;font-size:18px}
.modal .mh button{color:#fff;font-size:22px;line-height:1}
.modal .mb{padding:20px}
.modal .mb p{font-size:14px;line-height:1.7;margin-bottom:12px}
.modal .g{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.modal .g .full{grid-column:1/-1}
.modal label{display:block;font-size:12px;font-weight:700;color:var(--ink);margin-bottom:4px}
.modal input,.modal select,.modal textarea{width:100%;font:inherit;font-size:14px;border:1px solid #ccc;padding:9px 10px;color:var(--ink);background:#fff;border-radius:0}
.modal textarea{min-height:200px;font-family:ui-monospace,Menlo,monospace;font-size:12px}
.modal .score2{display:flex;align-items:center;gap:8px}
.modal .score2 span{font-weight:800}
.modal .mf{display:flex;justify-content:space-between;gap:8px;padding:14px 20px;border-top:1px solid var(--line);flex-wrap:wrap}
.modal .mf .r{display:flex;gap:8px;margin-left:auto}
.mbtn{height:42px;padding:0 18px;font-size:14px;font-weight:700;border:1px solid #bbb;background:#fff;color:var(--ink)}
.mbtn.pri{background:var(--main);border-color:var(--main);color:#fff}
.mbtn.danger{color:var(--red);border-color:#f0c4c0}
.merr{color:var(--red);font-size:13px;margin-top:10px;min-height:1em}
.ytst{font-size:12px;color:#bbb;margin-left:auto;padding-right:4px}
@media (max-width:560px){.modal .g{grid-template-columns:1fr}}

/* ===== partners band ===== */
.partners{background:var(--main);padding:26px 0 30px;text-align:center}
.partners h5{color:#fff;font-size:14px;font-weight:700;letter-spacing:.02em;margin-bottom:16px}
.pills{display:flex;flex-wrap:wrap;justify-content:center;gap:10px 10px;max-width:760px;margin:0 auto}
.pills span{min-width:88px;height:30px;padding:0 18px;border-radius:15px;display:inline-flex;align-items:center;justify-content:center;font-size:13px;font-weight:700}

/* ===== footer ===== */
.f1{background:var(--dark);padding:26px 0}
.f1 .in{display:flex;align-items:center;justify-content:space-between;gap:20px}
.f1 nav{display:flex;gap:36px}
.f1 nav a{color:#666;font-weight:700;font-size:16px}
.f1 nav a:hover{color:#aaa}
.f1 .fm{display:flex;flex-direction:column;align-items:center;color:#ddd;font-size:11px;font-weight:700;gap:4px}
.f1 .fm img{width:56px;height:56px;filter:grayscale(1) brightness(1.5);opacity:.9}
.f1 .fam{border:1px solid #555;color:#ddd;font-size:12px;padding:10px 14px;min-width:160px;display:flex;justify-content:space-between}
.f2{background:var(--darker);padding:22px 0 30px;font-size:11px;color:#888}
.f2 .in{display:flex;justify-content:space-between;align-items:center;gap:20px;flex-wrap:wrap}
.f2 .lk{display:flex;gap:20px}

/* ---------------- 영어 자동 번역 (MyMemory 무료 번역) ---------------- */
let AUTO_TR=store.get('cufc-autotr')!=='off';
const trCache={};
async function tr(text){
  text=(text||'').trim(); if(!text) return '';
  if(trCache[text]) return trCache[text];
  try{
    const r=await fetch('https://api.mymemory.translated.net/get?q='+encodeURIComponent(text.slice(0,480))+'&langpair=ko|en');
    const j=await r.json(); const t=j&&j.responseData&&j.responseData.translatedText;
    if(t&&+j.responseStatus===200&&!/MYMEMORY WARNING|QUERY LENGTH/i.test(t)){ const clean=t.replace(/&#39;/g,"'").replace(/&quot;/g,'"').replace(/&amp;/g,'&'); trCache[text]=clean; return clean; }
  }catch(e){}
  return null;
}
const hasKorean=t=>/[ㄱ-ㅎ가-힣]/.test(t||'');
/* 선수 이름은 번역 대신 등록된 영문 이름으로 바꿉니다 */
const scorersEn=ko=>{ let t=ko||''; DATA.players.slice().sort((a,b)=>(b.ko||'').length-(a.ko||'').length).forEach(p=>{ if(p.ko&&p.en) t=t.split(p.ko).join(p.en); }); return t; };
async function autoEn(obj){
  if(!AUTO_TR||!obj||obj.enManual||!obj.ko||!hasKorean(obj.ko)) return false;
  const t=await tr(obj.ko); if(t){ obj.en=t; return true; } return false;
}
const isBiObj=o=>o&&typeof o==='object'&&!Array.isArray(o)&&typeof o.ko==='string'&&Object.keys(o).every(k=>['ko','en','enManual'].includes(k));
async function fillAllEnglish(btn){
  const todo=[]; const walk=o=>{ if(!o||typeof o!=='object') return; if(isBiObj(o)){ if(o.ko&&hasKorean(o.ko)&&(!o.en||o.en===o.ko)) todo.push(o); return; } for(const k in o) walk(o[k]); };
  walk(DATA);
  if(!todo.length) return toast(L('비어 있는 영어 칸이 없어요.','No empty English fields.'));
  let n=0; for(const o of todo){ if(btn) btn.textContent=`${L('번역 중','Translating')} ${n+1}/${todo.length}`; const t=await tr(o.ko); if(t){o.en=t;n++;} }
  changed(); render(false); toast(L(`영어 ${n}칸을 자동으로 채웠어요.`,`Filled ${n} English fields.`));
}

function matchItem(m,season){
  const S=DATA.seasons[season];
  const home=m[2]==='H'?'CUFC':m[3], away=m[2]==='H'?m[3]:'CUFC';
  const hs=m[2]==='H'?m[4]:m[5], as=m[2]==='H'?m[5]:m[4];
  const r=res(m), played=m[4]!=null;
  const venue=m[2]==='H'?L('치테코 커뮤니티 그라운드 (홈)','Chiteko Community Ground (home)'):L('원정','Away');
  const idx=S.matches.indexOf(m), base=`seasons.${season}.matches.${idx}`;
  const row=(k,s,o)=>{const col=k==='CUFC'?4:5;
    const sc=ui.admin?`<span class="sc" data-e="${base}.${col}" data-kind="score" contenteditable="plaintext-only" inputmode="numeric" spellcheck="false">${s??''}</span>`:`<span class="sc ${played&&s<o?'lo':''}">${played?s:''}</span>`;
    return `<div class="r">${fl(k)}<span class="tn ${k==='CUFC'?'us':''}">${esc(k==='CUFC'?L('치주물루 유나이티드','Chizumulu United'):N(team(k)))}</span>${sc}</div>`;};
  const scorers=lang==='ko'?(m[7]||m[8]):(m[8]||m[7]);
  const scorerHTML=ui.admin?`⚽ <span data-e="${base}.${lang==='ko'?7:8}" data-kind="scorer" contenteditable="plaintext-only" spellcheck="false">${esc(lang==='ko'?m[7]:m[8])}</span>`:(scorers?`⚽ ${esc(scorers)}`:'');
  const extra=[flagTxt(m[6]),scorerHTML].filter(Boolean).join(' · ');
  const vid=matchVid(m,season);
  return `<div class="m"><div class="hd"><div><div class="comp">${esc(N(S.league))} · ${L(m[0]+'라운드','Week '+m[0])}<span class="tag ${r}">${resTxt(r)}</span>${ui.admin?`<button class="adm-edit" data-s="${season}" data-i="${idx}">✎ ${L('경기 수정','Edit match')}</button>`:''}</div><div class="ven">${venue}</div></div><div class="dt">${kdate(m[1])}</div></div>
    <div class="rows">${row(home,hs,as)}${row(away,as,hs)}</div>${extra?`<div class="scr">${extra}</div>`:''}${vid?`<a class="hl" href="${yt(vid)}" target="_blank" rel="noopener">${L('하이라이트 영상','Watch highlights')}</a>`:''}</div>`;
}

function kitSvg(k,i){

  const shirt="M52 12 L30 18 L4 46 L22 70 L34 60 L34 160 L126 160 L126 60 L138 70 L156 46 L130 18 L108 12 C102 26 58 26 52 12Z";
  let pat='';
  if(k.pat==='island') pat=`<path d="M40 95 C55 80 70 88 80 78 C92 66 110 74 120 86 C130 98 118 112 100 116 C82 120 60 112 40 95Z" fill="${k.acc}" opacity=".55"/>`;

}
const videoList=key=>{
  const hidden=new Set(DATA.hiddenVideos||[]);
  const own=(DATA.videos[key]||[]).map((v,i)=>({v,i}));
  const ownIds=new Set(Object.values(DATA.videos).flat().map(v=>v.id));

/* ---- 후원 · 제안 신청함 ---- */
const INBOX={state:'idle',items:[],sheetUrl:'',filter:'all',newCount:0,err:''};
const STATUSES=[['새 신청',bi('새 신청','New')],['확인 중',bi('확인 중','In review')],['완료',bi('완료','Done')]];
const stIdx=s=>Math.max(0,STATUSES.findIndex(x=>x[0]===s));
async function loadInbox(){
  if(!DATA.config.formUrl||!VAULT||!VAULT.formSecret) return;
  INBOX.state='loading'; softRenderAdmin();
  try{ const r=await formApi('list',{secret:VAULT.formSecret}); if(!r.ok) throw new Error(r.error);
    INBOX.items=r.items||[]; INBOX.sheetUrl=r.sheetUrl||''; INBOX.state='ok'; INBOX.newCount=INBOX.items.filter(x=>stIdx(x.status)===0).length;
  }catch(e){ INBOX.state='fail'; INBOX.err=e.message; }
  softRenderAdmin();
}
function softRenderAdmin(){ const ae=document.activeElement; if(ae&&ae.closest&&ae.closest('#mbg,.inq input,.inq select,[data-e],form')){ chrome(); return; } const {sec}=route(); if(sec==='admin') render(false); else chrome(); }
function pInbox(){
  if(!DATA.config.formUrl||!VAULT.formSecret) return `<div class="box">${bar(L('후원 · 제안 신청','Proposals'),`<div class="opt static">${L('이메일 알림 연결 필요','Email not connected')}</div>`)}
    <div class="pad txt"><p>${L('제안하기 신청서를 받아 이메일로 알리려면 구글 시트와 한 번 연결해야 해요. (10분 정도, 무료)','To receive proposals by email, connect a Google Sheet once (about 10 minutes, free).')}</p>
    <p><a href="#/admin/settings" style="color:var(--main);font-weight:700">→ ${L('게시 · 이메일 설정에서 연결하기','Connect in Publishing & Email')}</a></p></div></div>`;
  if(INBOX.state==='idle') setTimeout(loadInbox,0);
  const f=INBOX.filter, items=INBOX.items.filter(x=>f==='all'||String(stIdx(x.status))===f);
  const cnt=k=>k==='all'?INBOX.items.length:INBOX.items.filter(x=>String(stIdx(x.status))===k).length;
  const fmt=a=>{const d=new Date(a); return isNaN(d)?esc(a):`${d.getFullYear()}.${String(d.getMonth()+1).padStart(2,'0')}.${String(d.getDate()).padStart(2,'0')} ${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}`;};
  return `<div class="box">${bar(L('후원 · 제안 신청','Proposals'),`<div class="opt static">${INBOX.state==='loading'?L('불러오는 중…','Loading…'):L(`전체 ${INBOX.items.length}건 · 새 신청 ${INBOX.newCount}건`,`${INBOX.items.length} total · ${INBOX.newCount} new`)}</div>`,`<button class="barbtn" data-act="reloadinbox">↻ ${L('새로고침','Refresh')}</button>`)}
    <div class="inbox-f">${[['all',bi('전체','All')],['0',STATUSES[0][1]],['1',STATUSES[1][1]],['2',STATUSES[2][1]]].map(([k,t])=>`<button data-act="ifilter" data-f="${k}" class="${f===k?'on':''}">${N(t)} ${cnt(k)}</button>`).join('')}
      ${INBOX.sheetUrl?`<span style="margin-left:auto;font-size:13px">${extLink(INBOX.sheetUrl,L('구글 시트에서 보기','Open Google Sheet'))}</span>`:''}</div>
    ${INBOX.state==='fail'?`<div class="srcnote" style="color:var(--red)">${L('신청 목록을 불러오지 못했어요: ','Could not load proposals: ')}${esc(INBOX.err)}</div>`:''}
    ${items.map(x=>{const si=stIdx(x.status);return `<div class="inq" data-id="${esc(x.id)}">
      <div class="h"><span class="st s${si}">${N(STATUSES[si][1])}</span><span>${fmt(x.at)}</span><span>· ${esc(x.type)}</span></div>
      <h5>${esc(x.subject)}</h5>
      <div class="who">${esc(x.name)}${x.org?` · ${esc(x.org)}`:''} · <a href="mailto:${esc(x.email)}">${esc(x.email)}</a></div>
      <details ${si===0?'open':''}><summary>${L('신청 내용','Details')}</summary><div class="bd">${esc(x.body)}</div></details>
      <div class="act"><select data-k="status">${STATUSES.map((s,i)=>`<option value="${s[0]}" ${i===si?'selected':''}>${N(s[1])}</option>`).join('')}</select>
        <input data-k="memo" value="${esc(x.memo||'')}" placeholder="${L('메모 (관리자끼리만 보여요)','Memo (admins only)')}">
        <button data-act="saveinq">${L('저장','Save')}</button>
        <a class="reply" href="mailto:${esc(x.email)}?subject=${encodeURIComponent('Re: '+x.subject)}">${L('이메일로 답장','Reply by email')}</a>
        <button class="danger" data-act="delinq">${L('삭제','Delete')}</button></div></div>`;}).join('')||`<div class="srcnote" style="text-align:center;padding:40px">${INBOX.state==='loading'?L('불러오는 중…','Loading…'):L('아직 들어온 신청이 없어요.','No proposals yet.')}</div>`}</div>`;
}

/* ===== 관리자 계정 · 잠금 보관함 =====
   - 아이디·비밀번호로 로그인합니다. 비밀번호는 어디에도 저장되지 않습니다.
   - GitHub 토큰, 신청서 연결 키, 관리자 이메일은 '보관함'에 담아 잠가서(AES-GCM) 저장합니다.
   - 보관함 열쇠(마스터 키)는 관리자마다 자기 비밀번호로 한 번 더 잠가 둡니다(PBKDF2 31만 회).
   - 그래서 공개 파일(data.json)에는 잠긴 데이터만 들어가고, 비밀번호를 아는 관리자만 열 수 있습니다. */
let MK=null, VAULT=null;
const te=new TextEncoder(), tdc=new TextDecoder();
const hex=b=>[...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,'0')).join('');
const unhex=h=>new Uint8Array((h||'').match(/../g).map(x=>parseInt(x,16)));
const rnd=n=>crypto.getRandomValues(new Uint8Array(n));
const buf64=b=>{const u=new Uint8Array(b);let s='';for(let i=0;i<u.length;i+=0x8000)s+=String.fromCharCode(...u.subarray(i,i+0x8000));return btoa(s);};
const unbuf64=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
function needCrypto(){ if(!(window.crypto&&crypto.subtle)) throw new Error(L('이 화면에서는 암호화 기능을 쓸 수 없어요. 공개 사이트 주소(https://…)에서 열어 주세요.','Encryption is unavailable here. Open the site at its https:// address.')); }
async function kekFrom(pw,saltHex){ needCrypto(); const k=await crypto.subtle.importKey('raw',te.encode(pw),'PBKDF2',false,['deriveKey']); return crypto.subtle.deriveKey({name:'PBKDF2',salt:unhex(saltHex),iterations:310000,hash:'SHA-256'},k,{name:'AES-GCM',length:256},false,['encrypt','decrypt']); }
const aesKey=raw=>crypto.subtle.importKey('raw',raw,{name:'AES-GCM'},false,['encrypt','decrypt']);
async function seal(key,bytes){ const iv=rnd(12); return {iv:hex(iv),ct:buf64(await crypto.subtle.encrypt({name:'AES-GCM',iv},key,bytes))}; }
async function open_(key,o){ return new Uint8Array(await crypto.subtle.decrypt({name:'AES-GCM',iv:unhex(o.iv)},key,unbuf64(o.ct))); }
async function wrapFor(pw,mk){ const salt=hex(rnd(16)); const w=await seal(await kekFrom(pw,salt),mk); return {salt,iv:w.iv,wk:w.ct}; }
async function unwrapWith(pw,a){ return open_(await kekFrom(pw,a.salt),{iv:a.iv,ct:a.wk}); }
async function readVault(d,mk){ return JSON.parse(tdc.decode(await open_(await aesKey(mk),d.vault))); }
async function saveVault(){ DATA.vault=await seal(await aesKey(MK),te.encode(JSON.stringify(VAULT))); }
const ID_RE=/^[A-Za-z0-9_.-]{3,20}$/, MAIL_RE=/^[^@\s]+@[^@\s]+\.[^@\s]+$/;
const today=()=>{const d=new Date();return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;};
function guessRepo(){ try{const h=location.hostname, p=location.pathname.split('/').filter(Boolean); if(/\.github\.io$/.test(h)) return {owner:h.split('.')[0],repo:p[0]||h};}catch(e){} return {}; }
/* 로그인할 때는 이 브라우저의 수정본이 있으면 그것을, 없으면 게시된 내용을 봅니다 */
function loginSource(){ try{ const d=JSON.parse(store.get('cufc-draft')||'null'); if(d&&Array.isArray(d.accounts)&&d.accounts.length&&d.vault) return d; }catch(e){} return JSON.parse(PUBLISHED); }

async function verifyToken(c){
  const H={Authorization:'Bearer '+c.token,Accept:'application/vnd.github+json'};
  let r;
  try{ r=await fetch(`https://api.github.com/repos/${encodeURIComponent(c.owner)}/${encodeURIComponent(c.repo)}`,{headers:H,cache:'no-store'}); }
  catch(e){ throw new Error(L('GitHub에 연결하지 못했어요. 인터넷 연결을 확인해 주세요.','Could not reach GitHub. Check your connection.')); }
  if(r.status===401) throw new Error(L('토큰이 올바르지 않거나 만료됐어요.','The token is invalid or expired.'));
  if(r.status===404) throw new Error(L('저장소를 찾을 수 없어요. GitHub 아이디·저장소 이름과 토큰 권한을 확인해 주세요.','Repository not found. Check the owner, repo name and token access.'));
  if(!r.ok) throw new Error(L('GitHub 확인 실패: ','GitHub check failed: ')+r.status);
  const j=await r.json();
  if(j.permissions&&j.permissions.push===false) throw new Error(L('이 토큰으로는 이 저장소에 쓸 수 없어요.','This token cannot write to this repository.'));
  return true;
}

    `<button class="mbtn" data-act="tryedit">${L('편집 연습','Practise')}</button><div class="r"><button class="mbtn" data-act="close">${L('취소','Cancel')}</button><button class="mbtn pri" data-act="login">${L('로그인','Sign in')}</button></div>`);

    <div class="g">

      <div class="full"><label>${L('아이디 (영문·숫자 3~20자)','ID (3–20 letters/numbers)')}</label><input id="su-id" autocomplete="username"></div>
      <div><label>${L('비밀번호 (10자 이상)','Password (10+)')}</label><input id="su-pw" type="password" autocomplete="new-password"></div>
      <div><label>${L('비밀번호 확인','Confirm')}</label><input id="su-pw2" type="password" autocomplete="new-password"></div>
      <div class="full" style="border-top:1px solid var(--line);margin-top:6px;padding-top:12px"><label>${L('GitHub 토큰','GitHub token')}</label><input id="su-token" type="password" placeholder="github_pat_..." autocomplete="off"></div>
      <div><label>${L('GitHub 아이디 (저장소 주인)','GitHub owner')}</label><input id="su-owner" value="${esc(g.owner||'')}"></div>
      <div><label>${L('저장소 이름','Repository')}</label><input id="su-repo" value="${esc(g.repo||'')}"></div>
    </div>
    <div class="ghsteps" style="margin-top:14px">${L('토큰 만들기: <a href="https://github.com/settings/personal-access-tokens/new" target="_blank" rel="noopener" style="color:var(--main);font-weight:700">새 토큰 ↗</a> → Repository access: <b>이 저장소만</b> → Permissions: <b>Contents · Read and write</b> → Generate','Create a token: <a href="https://github.com/settings/personal-access-tokens/new" target="_blank" rel="noopener" style="color:var(--main);font-weight:700">New token ↗</a> → Repository access: <b>only this repo</b> → Permissions: <b>Contents · Read and write</b> → Generate')}</div>`,
    `<button class="mbtn" data-act="tryedit">${L('편집 연습','Practise')}</button><div class="r"><button class="mbtn" data-act="close">${L('취소','Cancel')}</button><button class="mbtn pri" data-act="setup">${L('만들고 게시','Create & publish')}</button></div>`,true);
  if(errMsg) merr(errMsg);
}
async function doSetup(btn){
  const v=id=>document.getElementById(id).value.trim();
  const email=v('su-email'), id=v('su-id'), pw=document.getElementById('su-pw').value, pw2=document.getElementById('su-pw2').value;
  const repo={owner:v('su-owner'),repo:v('su-repo'),branch:DATA.config.repo.branch||'main',path:DATA.config.repo.path||'data.json'}, token=v('su-token');
  if(!MAIL_RE.test(email)) return merr(L('이메일 형식을 확인해 주세요.','Check the email address.'));
  if(!ID_RE.test(id)) return merr(L('아이디는 영문·숫자·_.- 로 3~20자여야 해요.','ID must be 3–20 letters, numbers or _.-'));
  if(pw.length<10) return merr(L('비밀번호는 10자 이상이어야 해요.','Password must be at least 10 characters.'));
  if(pw!==pw2) return merr(L('비밀번호 확인이 다릅니다.','Passwords do not match.'));
  if(!token||!repo.owner||!repo.repo) return merr(L('GitHub 토큰, 아이디, 저장소 이름을 모두 넣어 주세요.','Token, owner and repository are required.'));
  btn.textContent=L('확인 중…','Checking…');
  try{
    await verifyToken({...repo,token});
    MK=rnd(32); VAULT={token,formSecret:'',emails:{[id]:email}};
    DATA.config.repo=repo;
    DATA.accounts=[{id,role:'owner',created:today(),...await wrapFor(pw,MK)}];
    await saveVault();
  }catch(e){ btn.textContent=L('만들고 게시','Create & publish'); return merr(e.message); }
  enterAdmin({id,role:'owner'},true); changed();
  await publish();
}
async function doLogin(btn){
  const id=document.getElementById('li-id').value.trim(), pw=document.getElementById('li-pw').value;
  const src=loginSource(); const a=(src.accounts||[]).find(x=>x.id.toLowerCase()===id.toLowerCase());
  if(!a) return merr(L('아이디 또는 비밀번호가 맞지 않습니다.','Incorrect ID or password.'));
  btn.textContent=L('확인 중…','Checking…');
  try{ MK=await unwrapWith(pw,a); VAULT=await readVault(src,MK); }
  catch(e){ MK=null; VAULT=null; btn.textContent=L('로그인','Sign in'); return merr(e.message&&/암호화|Encryption/.test(e.message)?e.message:L('아이디 또는 비밀번호가 맞지 않습니다.','Incorrect ID or password.')); }
  enterAdmin({id:a.id,role:a.role});
}
function enterAdmin(user,fresh){
  ui.admin=true; ui.user=user; closeModal();
  if(!fresh){ const draft=store.get('cufc-draft'); if(draft){ try{ const d=migrate(JSON.parse(draft)); if(JSON.stringify(d)!==PUBLISHED){ DATA=d; toast(L('이전에 저장해 둔 수정 내용을 불러왔어요.','Loaded your unpublished edits.')); } }catch(e){} } }
  if(MK&&!user.practice){ try{ sessionStorage.setItem('cufc-sess',JSON.stringify({id:user.id,role:user.role,mk:hex(MK)})); }catch(e){} }
  render(false);
  if(!user.practice&&DATA.config.formUrl&&VAULT&&VAULT.formSecret){ INBOX.state='idle'; loadInbox(); }
}
function exitAdmin(){

/* ---- 신청서 (Google Apps Script) ---- */
const APPS_SCRIPT_CODE="/**\n * 치주물루 유나이티드 FC 팬 사이트 — 후원·제안 신청서 접수 스크립트\n *\n * 하는 일\n *  1) 사이트의 \"제안하기\" 신청서를 이 구글 시트의 '신청' 탭에 저장합니다.\n *  2) 신청이 들어오면 관리자 이메일 모두에게 알림 메일을 보냅니다.\n *  3) 관리자 모드의 \"후원·제안 신청\" 탭에서 목록을 보고 상태를 바꿀 수 있게 해 줍니다.\n *\n * 설치 방법은 README.md의 \"4. 후원·제안 신청서 이메일 받기\"를 보세요.\n * 이 코드는 고칠 필요가 없습니다.\n */\n\nconst SHEET_NAME = '신청';\nconst HEADERS = ['번호', '접수 시각', '유형', '이름', '소속', '이메일', '제목', '내용', '언어', '상태', '메모'];\nconst MAX = { name: 100, org: 150, email: 200, subject: 200, body: 5000, type: 50 };\n\nfunction doGet() {\n  return out({ ok: true, service: 'cufc-forms', ready: !!props_().getProperty('SECRET') });\n}\n\nfunction doPost(e) {\n  let req = {};\n  try { req = JSON.parse((e && e.postData && e.postData.contents) || '{}'); }\n  catch (err) { return out({ ok: false, error: 'bad_request' }); }\n\n  try {\n    if (req.action === 'submit') return out(submit_(req));\n    if (req.action === 'init') return out(init_(req));\n\n    // 아래는 관리자만 (사이트의 관리자 계정 안에 잠겨 있는 비밀 키가 있어야 함)\n    const secret = props_().getProperty('SECRET');\n    if (!secret || req.secret !== secret) return out({ ok: false, error: 'unauthorized' });\n\n    switch (req.action) {\n      case 'list': return out(list_());\n      case 'update': return out(update_(req));\n      case 'delete': return out(remove_(req));\n      case 'setAdmins': return out(setAdmins_(req));\n      case 'test': return out(test_());\n      default: return out({ ok: false, error: 'unknown_action' });\n    }\n  } catch (err) {\n    return out({ ok: false, error: String(err && err.message || err) });\n  }\n}\n\n/* ---------- 처음 연결 ---------- */\nfunction init_(req) {\n  const p = props_();\n  if (p.getProperty('SECRET')) return { ok: false, error: 'already_initialized' };\n  if (!req.secret || String(req.secret).length < 32) return { ok: false, error: 'bad_secret' };\n  p.setProperty('SECRET', String(req.secret));\n  saveAdmins_(req.admins);\n  sheet_();\n  return { ok: true, sheetUrl: SpreadsheetApp.getActiveSpreadsheet().getUrl() };\n}\n\n/* 사이트를 처음부터 다시 연결해야 할 때만, 편집기에서 이 함수를 직접 실행하세요. */\nfunction resetConnection() {\n  props_().deleteProperty('SECRET');\n  props_().deleteProperty('ADMINS');\n  Logger.log('연결을 초기화했습니다. 사이트의 관리자 모드에서 다시 연결해 주세요.');\n}\n\n/* ---------- 신청 접수 ---------- */\nfunction submit_(req) {\n  if (req.website) return { ok: true };            // 스팸 로봇이 채우는 숨은 칸\n  const f = {};\n  for (const k in MAX) f[k] = String(req[k] || '').trim().slice(0, MAX[k]);\n  if (!f.name || !f.email || !f.subject || !f.body) return { ok: false, error: 'missing_fields' };\n  if (!/^[^@\\s]+@[^@\\s]+\\.[^@\\s]+$/.test(f.email)) return { ok: false, error: 'bad_email' };\n\n  // 같은 이메일로 1분 안에 여러 번 보내는 것 막기\n  const cache = CacheService.getScriptCache();\n  const key = 'rate_' + f.email.toLowerCase();\n  if (cache.get(key)) return { ok: false, error: 'too_fast' };\n  cache.put(key, '1', 60);\n\n  const lock = LockService.getScriptLock();\n  lock.waitLock(10000);\n  let id;\n  try {\n    const sh = sheet_();\n    id = Utilities.getUuid().slice(0, 8);\n    sh.appendRow([id, new Date(), f.type, f.name, f.org, f.email, f.subject, f.body, String(req.lang || 'ko'), '새 신청', '']);\n  } finally {\n    lock.releaseLock();\n  }\n\n  notify_(f, String(req.site || ''));\n  return { ok: true, id };\n}\n\nfunction notify_(f, site) {\n  const admins = loadAdmins_().map(a => a.email).filter(Boolean);\n  if (!admins.length) return;\n  const subject = '[치주물루 사이트] 새 ' + (f.type || '후원·제안') + ' 신청 — ' + f.subject;\n  const lines = [\n    '사이트에 새 신청이 들어왔어요.', '',\n    '유형: ' + f.type,\n    '이름: ' + f.name,\n    f.org ? '소속: ' + f.org : null,\n    '이메일: ' + f.email,\n    '제목: ' + f.subject, '',\n    f.body, '',\n    '— 이 메일에 \"답장\"하면 신청한 분께 바로 회신돼요.',\n    site ? '— 관리자 모드에서 보기: ' + site + '#/admin/inbox' : null,\n    '— 구글 시트에서 보기: ' + SpreadsheetApp.getActiveSpreadsheet().getUrl()\n  ].filter(x => x !== null);\n  MailApp.sendEmail({ to: admins.join(','), replyTo: f.email, subject: subject, body: lines.join('\\n'), name: '치주물루 사이트' });\n}\n\n/* ---------- 관리자 기능 ---------- */\nfunction list_() {\n  const sh = sheet_();\n  const n = sh.getLastRow() - 1;\n  const rows = n > 0 ? sh.getRange(2, 1, n, HEADERS.length).getValues() : [];\n  const items = rows.map(r => ({\n    id: String(r[0]), at: r[1] instanceof Date ? r[1].toISOString() : String(r[1]),\n    type: r[2], name: r[3], org: r[4], email: r[5], subject: r[6], body: r[7], lang: r[8], status: r[9], memo: r[10]\n  })).reverse();\n  return { ok: true, items, sheetUrl: SpreadsheetApp.getActiveSpreadsheet().getUrl() };\n}\n\nfunction findRow_(id) {\n  const sh = sheet_();\n  const n = sh.getLastRow() - 1;\n  if (n < 1) return -1;\n  const ids = sh.getRange(2, 1, n, 1).getValues().map(r => String(r[0]));\n  const i = ids.indexOf(String(id));\n  return i < 0 ? -1 : i + 2;\n}\n\nfunction update_(req) {\n  const row = findRow_(req.id);\n  if (row < 0) return { ok: false, error: 'not_found' };\n  const sh = sheet_();\n  if (req.status !== undefined) sh.getRange(row, 10).setValue(String(req.status).slice(0, 20));\n  if (req.memo !== undefined) sh.getRange(row, 11).setValue(String(req.memo).slice(0, 1000));\n  return { ok: true };\n}\n\nfunction remove_(req) {\n  const row = findRow_(req.id);\n  if (row < 0) return { ok: false, error: 'not_found' };\n  sheet_().deleteRow(row);\n  return { ok: true };\n}\n\nfunction setAdmins_(req) {\n  saveAdmins_(req.admins);\n  return { ok: true, count: loadAdmins_().length };\n}\n\nfunction test_() {\n  const admins = loadAdmins_().map(a => a.email).filter(Boolean);\n  if (!admins.length) return { ok: false, error: 'no_admin_emails' };\n  MailApp.sendEmail({ to: admins.join(','), subject: '[치주물루 사이트] 테스트 메일', body: '신청서 알림이 이 주소로 잘 도착합니다.', name: '치주물루 사이트' });\n  return { ok: true, sent: admins.length, remaining: MailApp.getRemainingDailyQuota() };\n}\n\n/* ---------- 도우미 ---------- */\nfunction props_() { return PropertiesService.getScriptProperties(); }\n\nfunction saveAdmins_(list) {\n  const clean = (Array.isArray(list) ? list : [])\n    .map(a => ({ id: String(a.id || '').slice(0, 40), email: String(a.email || '').trim().slice(0, 200) }))\n    .filter(a => /^[^@\\s]+@[^@\\s]+\\.[^@\\s]+$/.test(a.email));\n  props_().setProperty('ADMINS', JSON.stringify(clean));\n}\nfunction loadAdmins_() {\n  try { return JSON.parse(props_().getProperty('ADMINS') || '[]'); } catch (e) { return []; }\n}\n\nfunction sheet_() {\n  const ss = SpreadsheetApp.getActiveSpreadsheet();\n  let sh = ss.getSheetByName(SHEET_NAME);\n  if (!sh) {\n    sh = ss.insertSheet(SHEET_NAME);\n    sh.appendRow(HEADERS);\n    sh.setFrozenRows(1);\n    sh.getRange(1, 1, 1, HEADERS.length).setFontWeight('bold');\n  }\n  return sh;\n}\n\nfunction out(obj) {\n  return ContentService.createTextOutput(JSON.stringify(obj)).setMimeType(ContentService.MimeType.JSON);\n}\n";

const b64=s=>{const b=new TextEncoder().encode(s);let bin='';for(let i=0;i<b.length;i+=0x8000)bin+=String.fromCharCode(...b.subarray(i,i+0x8000));return btoa(bin);};
async function publish(){

  if(!c.owner||!c.repo) return toast(L('게시 · 이메일 설정에서 저장소 정보를 넣어 주세요.','Set the repository in Publishing & Email.'));

  DATA.lastPublish={by:ui.user.id,at:new Date().toISOString()};
  toast(L('게시하는 중…','Publishing…'),60000);
  const api=`https://api.github.com/repos/${encodeURIComponent(c.owner)}/${encodeURIComponent(c.repo)}/contents/${c.path.split('/').map(encodeURIComponent).join('/')}`;
  const H={Authorization:'Bearer '+c.token,Accept:'application/vnd.github+json'};
  try{
    let sha; const r0=await fetch(api+'?ref='+encodeURIComponent(c.branch),{headers:H,cache:'no-store'});
    if(r0.ok) sha=(await r0.json()).sha; else if(r0.status!==404) throw new Error((await r0.json()).message||r0.status);
    const body={message:'사이트 내용 수정 (관리자 모드)',content:b64(JSON.stringify(DATA)),branch:c.branch}; if(sha) body.sha=sha;
    const r=await fetch(api,{method:'PUT',headers:{...H,'Content-Type':'application/json'},body:JSON.stringify(body)});
    if(!r.ok){ const m=(await r.json()).message||r.status; throw new Error(r.status===401?L('토큰이 만료됐거나 올바르지 않아요. 대표 관리자가 [게시 · 이메일 설정 → 토큰 바꾸기]로 새 토큰을 넣어야 해요.','The token expired or is invalid. An owner needs to replace it.'):m); }
    PUBLISHED=JSON.stringify(DATA); store.del('cufc-draft'); updateStrip();
    toast(L('✓ 게시했어요. 1~2분 뒤 공개 사이트에 반영됩니다.','✓ Published. The public site updates in 1–2 minutes.'),6000);
  }catch(e){ toast(L('게시 실패: ','Publish failed: ')+esc(e.message),9000); }
}

function readField(f,idx,item){
  const id='fx'+idx, el=document.getElementById(id), g=k=>document.getElementById(id+'-'+k).value.trim();
  switch(f.t){
    case 'text': case 'url': item[f.k]=el.value.trim(); break;
    case 'number': item[f.k]=el.value===''?'':+el.value; break;
    case 'date': item[f.k]=el.value||null; break;
    case 'color': case 'select': item[f.k]=el.value; break;
    case 'yt': { const v=ytId(el.value); if(v===null) throw new Error(L('유튜브 주소 형식을 확인해 주세요.','Check the YouTube URL.')); item[f.k]=v; break; }
    case 'bi': item[f.k]={ko:g('ko'),en:g('en')}; break;
    case 'self': item.ko=g('ko'); item.en=g('en'); break;
    case 'names': item.ko=g('ko'); item.en=g('en'); break;
    case 'image': item[f.k]=TMP[f.k]||''; break;
  }
}
function openItem(list,i,preset){

async function saveItem(list,i,btn){
  const sc=SCHEMA[list]; const arr=getP(list);
  const orig=i===''?sc.blank():JSON.parse(JSON.stringify(arr[+i]));
  const item=JSON.parse(JSON.stringify(orig));
  try{ sc.fields.forEach((f,k)=>readField(f,k,item)); }catch(e){ return merr(e.message); }
  /* 영어 칸: 직접 쓴 건 그대로, 비었거나 한국어만 바뀐 경우 자동 번역 */
  const pairs=sc.fields.filter(f=>f.t==='bi'||f.t==='self').map(f=>[f.t==='self'?item:item[f.k], f.t==='self'?orig:(orig[f.k]||{})]);
  for(const [o,old] of pairs){
    if(!o) continue;
    if(o.en&&o.en!==(old.en||'')) { o.enManual=true; continue; }
    if(old.enManual&&o.en) { o.enManual=true; continue; }
    if(AUTO_TR&&o.ko&&hasKorean(o.ko)&&(!o.en||o.ko!==(old.ko||''))){ if(btn) btn.textContent=L('번역 중…','Translating…'); const t=await tr(o.ko); if(t) o.en=t; }
  }
  if(list.startsWith('videos.')&&!item.id) return merr(L('유튜브 주소를 넣어 주세요.','Add a YouTube URL.'));
  if(i==='') arr.push(item); else arr[+i]=item;
  closeModal(); changed(); render(false);
}
function resizeImage(file,max){
  return new Promise((ok,bad)=>{const r=new FileReader(); r.onload=()=>{const im=new Image(); im.onload=()=>{const s=Math.min(1,max/Math.max(im.width,im.height)); const c=document.createElement('canvas'); c.width=Math.round(im.width*s); c.height=Math.round(im.height*s); c.getContext('2d').drawImage(im,0,0,c.width,c.height);
    const png=/png|webp|gif/.test(file.type); ok(c.toDataURL(png?'image/png':'image/jpeg',0.85));}; im.onerror=bad; im.src=r.result;}; r.onerror=bad; r.readAsDataURL(file);});
}

const CHANNEL_ID='UC5JtIP2gExbPDMbNMFr3aHA';

function autoLink(){
  for(const k in autoVid) delete autoVid[k];
  const season='2026-27', list=(DATA.seasons[season]||{matches:[]}).matches;
  const used=new Set(list.map(m=>matchVid(m,season)).filter(Boolean));
  const opps=[...new Set(list.map(m=>m[3]))];
  [...AUTO.highlights,...(DATA.videos.highlights||[])].filter(v=>!used.has(v.id)&&/하이라이트|highlight/i.test(v.ko||'')).sort((a,b)=>(a.d||'')<(b.d||'')?-1:1).forEach(v=>{
    const key=opps.find(k=>DATA.teams[k]&&v.ko.includes(DATA.teams[k].ko.split(' ')[0])); if(!key) return;
    const cand=list.filter(m=>m[3]===key&&m[4]!=null&&!matchVid(m,season)&&(!v.d||!m[1]||m[1]<=v.d)).pop();
    if(cand){autoVid[season+':'+cand[0]]=v.id; used.add(v.id);}
  });
}
async function syncYouTube(){
  ytState={s:'loading',at:null,added:0}; refreshVideoAreas();
  try{
    const feed='https://www.youtube.com/feeds/videos.xml?channel_id='+CHANNEL_ID;
    const r=await fetch('https://api.rss2json.com/v1/api.json?rss_url='+encodeURIComponent(feed));
    const j=await r.json(); if(j.status!=='ok'||!Array.isArray(j.items)) throw new Error('feed');
    const before=new Set([...AUTO.highlights,...AUTO.stories,...Object.values(DATA.videos).flat()].map(v=>v.id));
    AUTO.highlights=[];AUTO.stories=[]; let added=0;
    j.items.forEach(it=>{
      const id=((it.link||'').match(/v=([\w-]{11})/)||[])[1]; if(!id) return;
      const cat=/하이라이트|골모음|이달의 골|highlight|goals/i.test(it.title)?'highlights':'stories';
      AUTO[cat].push({id,d:(it.pubDate||'').slice(0,10)||null,ko:it.title,en:it.title,auto:true});
      if(!before.has(id)) added++;
    });
    ytState={s:'ok',at:new Date(),added};
  }catch(e){ ytState={s:'fail',at:null,added:0}; }
  autoLink(); refreshVideoAreas();
}

let pendingRender=false;
function softRender(){ pendingRender=true; setTimeout(()=>{ const ae=document.activeElement; if(pendingRender&&!(ae&&ae.closest&&ae.closest('[data-e],#mbg'))){ pendingRender=false; render(false); } },0); }
document.addEventListener('focusout',e=>{
  if(pendingRender) softRender();
  const el=e.target.closest&&e.target.closest('[data-e]'); if(!el) return;
  const path=el.dataset.e, v=getP(path), txt=el.innerText.replace(/\s+\n/g,'\n').trim();
  if(el.dataset.kind==='score'){
    const nv=txt===''?null:parseInt(txt.replace(/\D/g,''),10); const val=Number.isFinite(nv)?nv:null;
    if(v!==val){ setP(path,val); const m=getP(path.replace(/\.\d+$/,'')); if(m[4]!=null&&m[5]!=null&&['pending','upcoming','postponed'].includes(m[6])) m[6]=''; changed(); softRender(); }
    else el.textContent=v??'';
    return;
  }
  if(el.dataset.kind==='scorer'){
    if((v||'')!==txt){ setP(path,txt); const m=getP(path.replace(/\.\d+$/,'')); if(lang==='ko'&&txt) m[8]=scorersEn(txt); changed(); }
    return;
  }
  if(v&&typeof v==='object'){
    if((v[lang]||'')!==txt){
      v[lang]=txt;
      if(lang==='en') v.enManual=!!txt;
      changed();
      if(lang==='ko') autoEn(v).then(ok=>{ if(ok) changed(); });
    }
  }
  else { const nv=typeof v==='number'?(txt===''?'':+txt):txt; if(v!==nv){ setP(path,nv); changed(); } }
});
document.addEventListener('keydown',e=>{
  const el=e.target.closest&&e.target.closest('[data-e]');
  if(el&&e.key==='Enter'&&!e.shiftKey){ e.preventDefault(); el.blur(); return; }
  if(el&&e.key==='Escape'){ el.blur(); return; }
  if(e.key==='Escape') closeModal();
  if(e.key==='Enter'&&e.target.closest('#addacct')){ e.preventDefault(); const b=document.querySelector('[data-act=addacct]'); if(b) b.click(); return; }
  if(e.key==='Enter'&&e.target.closest('#mbg')&&e.target.tagName==='INPUT'&&e.target.type!=='file'){const b=document.querySelector('#mbg .mbtn.pri'); if(b){e.preventDefault(); b.click();}}
});
document.addEventListener('paste',e=>{ const el=e.target.closest&&e.target.closest('[data-e]'); if(!el) return; e.preventDefault(); const t=(e.clipboardData||window.clipboardData).getData('text'); document.execCommand('insertText',false,t.replace(/\n+/g,' ')); });

document.addEventListener('click',async e=>{
  if(e.target.closest('#langBtn')){lang=lang==='ko'?'en':'ko'; store.set('cufc-lang',lang); render(false); return;}
  const pb=e.target.closest('#ptabs button'); if(pb){ui.pos=pb.dataset.pos; const want=ui.pos==='COACH'?'staff':'players'; const {sub}=route(); if(sub!==want){CUR='#/team/'+want; try{history.replaceState(null,'',CUR);}catch(err){}} render(false); return;}
  if(e.target.closest('#burger')){document.getElementById('drawer').classList.toggle('open'); return;}
  if(e.target.id==='newProp'){ui.sent=null;render(true);return;}
  if(e.target.id==='copyBtn'){try{await navigator.clipboard.writeText(ui.sent.text);e.target.textContent=L('복사했어요','Copied');}catch(err){const r=document.createRange();r.selectNodeContents(document.getElementById('propText'));const sel=getSelection();sel.removeAllRanges();sel.addRange(r);e.target.textContent=L('선택됨 — Ctrl+C로 복사','Selected — press Ctrl+C');} return;}
  if(e.target.closest('#adminBtn')){ if(ui.admin) exitAdmin(); else openLogin(); return; }

  /* 목록 버튼 */
  const b=e.target.closest('[data-a]');
  if(b&&ui.admin){
    const a=b.dataset.a, list=b.dataset.l, i=b.dataset.i;
    if(a==='edit') return openItem(list,+i);
    if(a==='add'){ const preset=b.dataset.pos?{pos:b.dataset.pos}:null; return openItem(list,null,preset); }
    if(a==='up'||a==='down'){ const arr=getP(list); const j=+i+(a==='up'?-1:1); if(j<0||j>=arr.length) return; [arr[+i],arr[j]]=[arr[j],arr[+i]]; changed(); render(false); return; }
    if(a==='del'){ if(b.dataset.sure!=='1'){ b.dataset.sure='1'; b.textContent=L('삭제?','Delete?'); b.classList.add('sure'); setTimeout(()=>{ if(b.isConnected){b.dataset.sure='';b.textContent=b.closest('.mf')?L('삭제','Delete'):'✕';} },3000); return; }
      getP(list).splice(+i,1); closeModal(); changed(); render(false); return; }
    if(a==='addmatch') return openMatch(b.dataset.s,null);
    if(a==='bg'){ TMP={}; const cur=getP(b.dataset.p)||''; modal(L('배경 사진','Background photo'),`<p>${L('가로로 넓은 사진이 잘 어울려요. 자동으로 1600px 크기로 줄여 저장합니다.','Wide photos work best. Saved at up to 1600px wide.')}</p><div class="g">${fieldHTML(F.img('img',bi('사진','Photo'),1600),{img:cur},0)}</div>`,`<div class="r"><button class="mbtn" data-act="close">${L('취소','Cancel')}</button><button class="mbtn pri" data-act="savebg" data-p="${b.dataset.p}">${L('저장','Save')}</button></div>`); return; }
    if(a==='standing') return openStanding();
    if(a==='ytsync') return syncYouTube();
    if(a==='pin'){ const v=[...AUTO.highlights,...AUTO.stories].find(x=>x.id===b.dataset.id); if(v){ const c={...v}; delete c.auto; DATA.videos[list.split('.')[1]].push(c); changed(); render(false);} return; }
    if(a==='hide'){ (DATA.hiddenVideos=DATA.hiddenVideos||[]).push(b.dataset.id); changed(); render(false); return; }
  }
  const ed=e.target.closest('.adm-edit'); if(ed&&ui.admin) return openMatch(ed.dataset.s,+ed.dataset.i);

  /* 모달 버튼 */
  const t=e.target.closest('[data-act]'); if(!t) return;
  const act=t.dataset.act;
  if(act==='close') return closeModal();
  if(act==='login') return doLogin(t);
  if(act==='setup') return doSetup(t);
  if(act==='tryedit'){ MK=null; VAULT=null; return enterAdmin({id:L('연습 모드','Practice'),practice:true}); }
  if(act==='relogin'){ exitAdmin(); return openLogin(); }
  if(act==='addacct') return addAccount(t);
  if(act==='pwself') return openPw('self');
  if(act==='pwreset') return openPw('reset',+t.dataset.i);
  if(act==='savepw') return savePw(t.dataset.mode,t.dataset.i,t);
  if(act==='email') return openEmail(+t.dataset.i);
  if(act==='saveemail') return saveEmail(+t.dataset.i);
  if(act==='delacct'){ if(t.dataset.sure!=='1'){t.dataset.sure='1';t.textContent=L('정말 삭제?','Really delete?');return;}
    const a=DATA.accounts[+t.dataset.i]; if(a.role==='owner'&&DATA.accounts.filter(x=>x.role==='owner').length<2) return toast(L('대표 관리자는 최소 한 명 있어야 해요.','At least one owner is required.'));
    DATA.accounts.splice(+t.dataset.i,1); if(VAULT.emails) delete VAULT.emails[a.id]; await saveVault(); changed(); render(false); syncAdmins();
    return askPublish(L(`${esc(a.id)} 계정을 삭제했어요.`,`Deleted ${esc(a.id)}.`)); }
  if(act==='role'){ const a=DATA.accounts[+t.dataset.i]; if(a.role==='owner'&&DATA.accounts.filter(x=>x.role==='owner').length<2) return toast(L('대표 관리자는 최소 한 명 있어야 해요.','At least one owner is required.'));
    a.role=a.role==='owner'?'admin':'owner'; changed(); render(false); return askPublish(L('권한을 바꿨어요.','Role changed.')); }
  if(act==='copyscript'){ try{ await navigator.clipboard.writeText(APPS_SCRIPT_CODE); t.textContent=L('복사했어요 ✓','Copied ✓'); }catch(err){ modal(L('Apps Script 코드','Apps Script code'),`<p>${L('아래 코드를 모두 선택해 복사하세요.','Select all and copy.')}</p><textarea id="x-code" style="min-height:320px">${esc(APPS_SCRIPT_CODE)}</textarea>`,`<div class="r"><button class="mbtn" data-act="close">${L('닫기','Close')}</button></div>`,true); setTimeout(()=>{const ta=document.getElementById('x-code'); if(ta) ta.select();},50); } return; }
  if(act==='connectform') return connectForm(t);
  if(act==='testmail'){ t.textContent=L('보내는 중…','Sending…'); try{ const r=await formApi('test',{secret:VAULT.formSecret}); if(!r.ok) throw new Error(r.error==='no_admin_emails'?L('등록된 관리자 이메일이 없어요.','No admin emails registered.'):r.error); toast(L(`테스트 메일을 ${r.sent}명에게 보냈어요. 메일함을 확인해 보세요.`,`Test email sent to ${r.sent}.`),6000); }catch(e){ toast(L('보내지 못했어요: ','Failed: ')+esc(e.message),6000); } t.textContent=L('테스트 메일 보내기','Send a test email'); return; }
  if(act==='disconnect'){ if(t.dataset.sure!=='1'){t.dataset.sure='1';t.textContent=L('정말 끊을까요?','Really disconnect?');return;} DATA.config.formUrl=''; VAULT.formSecret=''; await saveVault(); changed(); render(false); return askPublish(L('신청서 연결을 끊었어요. 방문자는 "내용 복사" 방식으로 제안하게 돼요.','Disconnected. Visitors will copy their proposal instead.')); }
  if(act==='reloadinbox'){ INBOX.state='idle'; return loadInbox(); }
  if(act==='ifilter'){ INBOX.filter=t.dataset.f; return render(false); }
  if(act==='saveinq'||act==='delinq'){ const box=t.closest('.inq'), id=box.dataset.id;
    if(act==='delinq'&&t.dataset.sure!=='1'){t.dataset.sure='1';t.textContent=L('정말 삭제?','Really delete?');return;}
    t.textContent='…';
    try{ const r=act==='delinq'?await formApi('delete',{secret:VAULT.formSecret,id}):await formApi('update',{secret:VAULT.formSecret,id,status:box.querySelector('[data-k=status]').value,memo:box.querySelector('[data-k=memo]').value}); if(!r.ok) throw new Error(r.error); }
    catch(e){ toast(L('저장하지 못했어요: ','Failed: ')+esc(e.message),5000); }
    document.activeElement&&document.activeElement.blur&&document.activeElement.blur();
    INBOX.state='idle'; return loadInbox(); }
  if(act==='newtoken'){ return modal(L('토큰 바꾸기','Replace token'),`<p>${L('GitHub에서 새로 만든 토큰을 넣어 주세요. 확인되면 보관함에 잠가 저장하고 바로 게시해요.','Paste the new GitHub token. It is checked, locked into the vault and published right away.')}</p><label>${L('새 토큰','New token')}</label><input id="nt-token" type="password" placeholder="github_pat_..." autocomplete="off">`,`<div class="r"><button class="mbtn" data-act="close">${L('취소','Cancel')}</button><button class="mbtn pri" data-act="savetoken">${L('확인하고 저장','Check & save')}</button></div>`); }
  if(act==='savetoken'){ const tok=document.getElementById('nt-token').value.trim(); if(!tok) return merr(L('토큰을 넣어 주세요.','Enter a token.')); t.textContent=L('확인 중…','Checking…');
    try{ await verifyToken({...DATA.config.repo,token:tok}); }catch(e){ t.textContent=L('확인하고 저장','Check & save'); return merr(e.message); }
    VAULT.token=tok; await saveVault(); changed(); return publish(); }
  if(act==='editrepo'){ const c=DATA.config.repo; return modal(L('저장소 정보','Repository'),`<div class="g"><div><label>${L('GitHub 아이디 (owner)','Owner')}</label><input id="rp-owner" value="${esc(c.owner)}"></div><div><label>${L('저장소 이름','Repository')}</label><input id="rp-repo" value="${esc(c.repo)}"></div><div><label>${L('브랜치','Branch')}</label><input id="rp-branch" value="${esc(c.branch)}"></div><div><label>${L('데이터 파일','Data file')}</label><input id="rp-path" value="${esc(c.path)}"></div></div>`,`<div class="r"><button class="mbtn" data-act="close">${L('취소','Cancel')}</button><button class="mbtn pri" data-act="saverepo">${L('확인하고 저장','Check & save')}</button></div>`); }
  if(act==='saverepo'){ const g=id=>document.getElementById(id).value.trim(); const c={owner:g('rp-owner'),repo:g('rp-repo'),branch:g('rp-branch')||'main',path:g('rp-path')||'data.json'};
    t.textContent=L('확인 중…','Checking…'); try{ await verifyToken({...c,token:VAULT.token}); }catch(e){ t.textContent=L('확인하고 저장','Check & save'); return merr(e.message); }
    DATA.config.repo=c; closeModal(); changed(); render(false); return toast(L('저장소 정보를 바꿨어요.','Repository updated.')); }
  if(act==='logout') return exitAdmin();
  if(act==='saveitem') return saveItem(t.dataset.l,t.dataset.i,t);
  if(act==='savematch') return saveMatch(t.dataset.s,t.dataset.i);
  if(act==='delmatch'){ if(t.dataset.sure!=='1'){t.dataset.sure='1';t.textContent=L('한 번 더 누르면 삭제','Click again to delete');return;} DATA.seasons[t.dataset.s].matches.splice(+t.dataset.i,1); closeModal(); changed(); render(false); return; }
  if(act==='savestanding'){const pos=+document.getElementById('s-pos').value,tot=+document.getElementById('s-tot').value,as=document.getElementById('s-asof').value;
    if(!pos||!tot||!as) return merr(L('모든 칸을 입력해 주세요.','Fill in every field.')); DATA.standing={pos,total:tot,asof:as}; closeModal(); changed(); render(false); return;}
  if(act==='trfield'){ const ko=document.getElementById(t.dataset.id+'-ko').value, en=document.getElementById(t.dataset.id+'-en'); t.textContent=L('번역 중…','Translating…'); const r=await tr(ko); t.textContent='↻ '+L('한국어 → 영어 자동 번역','Translate Korean → English'); if(r) en.value=r; else merr(L('지금은 자동 번역을 쓸 수 없어요. 직접 입력해 주세요.','Translation is unavailable right now.')); return; }
  if(act==='fillen') return fillAllEnglish(t);
  if(act==='savebg'){ setP(t.dataset.p,TMP.img||''); closeModal(); changed(); render(false); return; }
  if(act==='imgclear'){ TMP[t.dataset.k]=''; document.getElementById(t.dataset.p).innerHTML=''; return; }
  if(act==='publish') return publish();
  if(act==='export') return openExport();
  if(act==='copydata'){const ta=document.getElementById('x-data'); try{await navigator.clipboard.writeText(ta.value);t.textContent=L('복사했어요','Copied');}catch(err){ta.select();t.textContent=L('선택됨 — Ctrl+C','Selected — Ctrl+C');} return;}
  if(act==='dl'){ try{const u=URL.createObjectURL(new Blob([JSON.stringify(DATA,null,1)],{type:'application/json'})); const a=document.createElement('a'); a.href=u; a.download='data.json'; document.body.appendChild(a); a.click(); a.remove(); setTimeout(()=>URL.revokeObjectURL(u),2000);}catch(err){merr(L('이 화면에서는 내려받기가 막혀 있어요. "복사"를 이용해 주세요.','Download is blocked here — use Copy.'));} return; }
  if(act==='import'){ try{ const d=JSON.parse(document.getElementById('x-data').value); if(!d.seasons||!d.players) throw 0; DATA=migrate(d); closeModal(); changed(); autoLink(); render(false);}catch(err){merr(L('형식이 올바르지 않습니다.','Invalid data.'));} return; }
  if(act==='reset'){ if(t.dataset.sure!=='1'){t.dataset.sure='1';t.textContent=L('한 번 더 누르면 초기화','Click again to reset');return;} DATA=JSON.parse(DEFAULT_JSON); closeModal(); changed(); autoLink(); render(false); return; }
  if(act==='discard'){ if(t.dataset.sure!=='1'){t.dataset.sure='1';t.textContent=L('정말 취소?','Really discard?');return;} DATA=JSON.parse(PUBLISHED); store.del('cufc-draft'); autoLink(); render(false); toast(L('게시된 상태로 되돌렸어요.','Reverted to the published version.')); return; }
});
document.addEventListener('change',async e=>{
  if(e.target.id==='seasonSel') return go('#/matches/'+e.target.value,false);
  if(e.target.id==='autotr'){ AUTO_TR=e.target.checked; store.set('cufc-autotr',AUTO_TR?'on':'off'); toast(AUTO_TR?L('한국어로 고치면 영어가 자동으로 번역돼요.','English will be translated automatically.'):L('영어 자동 번역을 껐어요.','Auto-translate is off.')); return; }
  if(e.target.id==='e-opp') document.getElementById('e-newteam').style.display=e.target.value==='__new'?'block':'none';
  if(e.target.id==='e-season') document.getElementById('e-newseason').style.display=e.target.value==='__new'?'block':'none';
  if(e.target.dataset&&e.target.dataset.img){ const f=e.target.files[0]; if(!f) return; try{ const url=await resizeImage(f,+e.target.dataset.max||400); TMP[e.target.dataset.img]=url; document.getElementById(e.target.id+'-p').innerHTML=`<img src="${url}" alt=""><button type="button" data-act="imgclear" data-k="${e.target.dataset.img}" data-p="${e.target.id}-p">${L('사진 지우기','Remove')}</button>`; }catch(err){ merr(L('이미지를 읽지 못했어요.','Could not read the image.')); } }
});
document.addEventListener('submit',async e=>{
  if(e.target.id!=='propForm') return; e.preventDefault();
  const f=new FormData(e.target); const g=k=>(f.get(k)||'').toString().trim();
  const err=document.getElementById('formErr');
  if(!g('name')||!g('mail')||!g('sub')||!g('body')){err.textContent=L('필수 항목(*)을 모두 입력해 주세요.','Please fill in all required fields (*).');return;}
  if(!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(g('mail'))){err.textContent=L('이메일 형식을 확인해 주세요.','Please check the email address.');return;}
  if(!f.get('agree')){err.textContent=L('안내 사항에 동의해 주세요.','Please tick the agreement box.');return;}
  const text=`[${g('type')}] ${g('sub')}\n\n${L('이름','Name')}: ${g('name')}${g('org')?'\n'+L('소속','Organisation')+': '+g('org'):''}\n${L('이메일','Email')}: ${g('mail')}\n\n${g('body')}`;
  if(DATA.config.formUrl){
    const btn=e.target.querySelector('button[type=submit]'); btn.disabled=true; btn.textContent=L('보내는 중…','Sending…');
    try{
      const r=await formApi('submit',{type:g('type'),name:g('name'),org:g('org'),email:g('mail'),subject:g('sub'),body:g('body'),lang,site:location.href.split('#')[0],website:g('website')});
      if(!r.ok) throw new Error(r.error==='too_fast'?L('잠시 후 다시 시도해 주세요.','Please try again in a minute.'):r.error);
      ui.sent={ok:true,text};
    }catch(err2){ ui.sent={text,err:err2.message}; }
  } else ui.sent={text};
  render(true);
});

/* ================= 시작 ================= */
{const {sec,sub}=route(); if(sec==='team'&&sub==='staff') ui.pos='COACH';}
autoLink(); render(false);
(async()=>{
  try{ if(/^https?:$/.test(location.protocol)){ const r=await fetch('data.json?t='+Date.now(),{cache:'no-store'}); if(r.ok){ const d=await r.json(); if(d&&d.players){ DATA=migrate(d); PUBLISHED=JSON.stringify(DATA); autoLink(); if(!ui.admin) render(false); } } } }catch(e){}
  store.del('cufc-gh');
  await restoreSession();
  syncYouTube();
})();
